app = "health-assistant-backend"
primary_region = "sin"

[build]
  image = "python:3.11-slim"

[env]
  PYTHONDONTWRITEBYTECODE = "1"
  PYTHONUNBUFFERED = "1"
  CORS_ALLOW_ORIGINS = "*"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_start_machines = true
  auto_stop_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    method = "get"
    path = "/openapi.json"

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"